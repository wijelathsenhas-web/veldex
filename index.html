    <style>

        header {

            align-items: center;
        }
        .header-container {
            width: 100%;

            display: flex;

            font-size: 2.8rem;

        }
        .store-logo {
            height: 90px;
            width: auto;
            object-fit: contain;
            border-radius: 8px;
        }
        header p {
            margin: 5px 0 0 0;
            color: #66c0f4; /* Steam Cyan Tint */

        }
        .auth-wrapper {
            flex-shrink: 0;
        }
        .auth-section {
            width: 380px;
            background: rgba(23, 26, 33, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #2a475e;
            padding: 25px 25px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: left;
            box-sizing: border-box;
        }
        .auth-section h2 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #fff;
            font-weight: 600;
        }
        .auth-group {
            margin-bottom: 15px;
        }
        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .auth-group label {
            font-size: 13px;
            color: #c7d5e0;
            font-weight: 500;
        }
        .error-msg {
            color: #ef4444;
            font-size: 12px;
            font-weight: bold;
            display: none;
        }
        .auth-section .input-field {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            background: #101822;
            border: 1px solid #2a475e;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .auth-section .input-field:focus {
            outline: none;
            border-color: #66c0f4;
            box-shadow: 0 0 0 2px rgba(102, 192, 244, 0.2);
        }
        .auth-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .auth-buttons .btn {
            flex: 1;
            margin-top: 0;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        #loggedInView {
            text-align: center;
        }
        .profile-card {
            background: #101822;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #2a475e;
            margin-bottom: 15px;
        }
        section {
            padding: 40px 20px;
            max-width: 1100px;
            margin: auto;
        }
        h2 {
            color: #66c0f4; /* Steam Blue */
            border-bottom: 1px solid #2a475e;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .card {
            background: #172030;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2a475e;
            transition: 0.2s;
            display: flex;
            align-items: center;
        }
        .card:hover {
            background: #202d44;
            border-color: #66c0f4;
        }
        .card img {
            width: 180px;
            height: 100px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .content {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .contact {

            padding: 40px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2a475e;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 25px;
            background: linear-gradient(to right, #47b649, #348838); /* Steam-ish Green Button */
            color: white;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-size: 16px;
        }
        .btn:hover {
            background: linear-gradient(to right, #52cf54, #3c9d41);
        }
        .btn-primary {
            background: linear-gradient(to bottom, #66c0f4, #1b2838);
            border: 1px solid #2a475e;
        }
        .btn-primary:hover {
            background: #66c0f4;
            color: #171a21;
        }
        .btn-danger {
            background: #a34c4c;
        }
        .btn-danger:hover {
            background: #d65858;
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #171a21;
            color: #556772;
            border-top: 1px solid #2a475e;
        }
        .comment-box {
            background: #172030;
            padding: 15px;
            margin: 10px auto;
            border-radius: 4px;
            text-align: left;
            width: 80%;
            border: 1px solid #2a475e;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }
        .comment-details {
            flex-grow: 1;
        }
        .comment-email-field {
            width: 80%;
            padding: 12px;
            margin: 10px auto;
            border-radius: 4px;
            border: 1px solid #2a475e;
            color: #c7d5e0;
            background: #101822;
            font-weight: bold;
            box-sizing: border-box;
        }
        .btn-delete {
            background: #a34c4c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-delete:hover {
            background: #ef4444;
        }
        .order-btn-wrapper {
            text-align: center;
            margin: 20px auto 40px auto;
        }
        .btn-order {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(to right, #47b649, #348838);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(52, 136, 56, 0.4);
            transition: 0.3s ease;
        }
        .btn-order:hover {
            background: linear-gradient(to right, #52cf54, #3c9d41);
            box-shadow: 0 6px 20px rgba(82, 207, 84, 0.6);
            transform: translateY(-2px);
        }
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .brand-section {
                align-items: center;
            }
            .logo-title-row {
                flex-direction: column;
                gap: 10px;
            }
            .auth-section {
                width: 100%;
                max-width: 380px;
            }
            .card {
                flex-direction: column;
                align-items: flex-start;
            }
            .card img {
                width: 100%;
                height: 150px;
            }
            .content {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

            <div class="auth-wrapper">

                        <div class="profile-card">

    <!-- සියලුම ගේම් සීරිස් / Categories ඩේටාබේස් එකෙන් ඇවිත් dynamic ව පිරෙන්නේ මේ ස්ථානයටයි -->
    <main id="dynamic-games-container">
        <div style="padding: 40px; text-align: center; color: #657786;">Loading Game Sections...</div>
    </main>

    <!-- ORDER GAMES Button Section -->
    <div class="order-btn-wrapper">
        <a href="https://wijelathsenhas-web.github.io/oder-games/" class="btn-order">🛒 ORDER GAMES</a>
    </div>

    <section>
        <h2>💬 Customer Comments</h2>
        <div class="contact">
            <input type="text" id="commentUserEmail" class="comment-email-field" readonly value="Please login to comment">
            <br>
            <textarea id="comment" placeholder="Write your comment..." style="width:80%; height:100px; padding:10px; border-radius:4px; border:1px solid #2a475e; color:white; background:#101822; font-family:Arial; box-sizing: border-box;"></textarea>
            <br>
            <button id="postBtn" class="btn">Post Comment</button>
            <div id="comments" style="margin-top:20px;">
                <p style="color: #657786;">Loading comments...</p>
            </div>
        </div>
    </section>

    <section class="contact">
        <h2>📞 Contact To Buy</h2>
        <p>WhatsApp: +94 72 602 3056</p>
        <p>Email: senhaswijelath@gmail.com</p>
        <a class="btn" href="https://wa.me/94726023056">Chat on WhatsApp</a>
    </section>

    <footer>© 2026 Game Cart Store</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDeNYoG3_UaomE28Nq1x2G3dZWyofWsOzI",
            authDomain: "gamecart-b6987.firebaseapp.com",
            projectId: "gamecart-b6987",
            storageBucket: "gamecart-b6987.firebasestorage.app",
            messagingSenderId: "828290925587",
            appId: "1:828290925587:web:2b0497f51887aa08c1abe6",
            measurementId: "G-KQLCCJSCG0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const commentsCollection = collection(db, "comments");
        const gamesCollection = collection(db, "games");

        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const userDisplayEmail = document.getElementById('userDisplayEmail');
        const emailInput = document.getElementById('authEmail');
        const passwordInput = document.getElementById('authPassword');
        const commentUserEmail = document.getElementById('commentUserEmail');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const mainContainer = document.getElementById("dynamic-games-container");

        let currentUser = null;
        function clearErrors() {
            emailError.innerText = "";
            emailError.style.display = "none";
            passwordError.innerText = "";
            passwordError.style.display = "none";
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loggedOutView.style.display = 'none';
                loggedInView.style.display = 'block';
                userDisplayEmail.innerText = user.email;
                commentUserEmail.value = "Posting as: " + user.email;
                document.getElementById("postBtn").disabled = false;
                clearErrors();
            } else {
                loggedOutView.style.display = 'block';
                loggedInView.style.display = 'none';
                commentUserEmail.value = "Please login to comment";
                document.getElementById("postBtn").disabled = true;
            }
            loadCommentsRealTime();
        });

        // 100% Dynamic Game Loading System (Firestore එකෙන් කෙලින්ම Categories හදනවා)
        function loadGamesRealTime() {
            onSnapshot(gamesCollection, (snapshot) => {
                mainContainer.innerHTML = ""; 

                if (snapshot.empty) {
                    mainContainer.innerHTML = `<section><p style="color: #657786; text-align:center;">No games available in the database.</p></section>`;
                    return;
                }

                // Firestore එකෙන් එන දත්ත Category අනුව වෙන් කරගැනීම
                const categoriesData = {};

                snapshot.forEach((snapshotDoc) => {
                    const game = snapshotDoc.data();
                    const category = game.category || "Other Games";

                    if (!categoriesData[category]) {
                        categoriesData[category] = [];
                    }
                    categoriesData[category].push(game);
                });

                // හැම Category එකකටම අදාළව HTML Section එක බැගින් Dynamic ව නිර්මාණය කිරීම
                Object.keys(categoriesData).forEach((categoryName) => {
                    const section = document.createElement("section");
                    
                    // Category එක සඳහා Title එකක් සෑදීම
                    const title = document.createElement("h2");
                    title.innerText = categoryName;
                    section.appendChild(title);

                    // ගේම් කාඩ්ස් බහාලීමට Grid එකක් සෑදීම
                    const grid = document.createElement("div");
                    grid.className = "grid";

                    // අදාළ Category එකේ ගේම්ස් සියල්ල Grid එකට එකතු කිරීම
                    categoriesData[categoryName].forEach((game) => {
                        const gameCard = document.createElement("div");
                        gameCard.className = "card";
                        gameCard.innerHTML = `
                            <img src="${game.image}" alt="${game.title}">
                            <div class="content">
                                <span>${game.title}</span>
                                <div class="price">${game.price}</div>
                            </div>
                        `;
                        grid.appendChild(gameCard);
                    });

                    section.appendChild(grid);
                    mainContainer.appendChild(section);
                });

            }, (error) => {
                console.error("Error loading games: ", error);
                mainContainer.innerHTML = `<section><p style="color: #ef4444; text-align:center;">Database Error. Please check Firestore Rules.</p></section>`;
            });
        }

        loadGamesRealTime();

        // AUTHENTICATION SIGN UP
        document.getElementById("signupBtn").addEventListener("click", () => {
            clearErrors();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if(email === "") {
                emailError.innerText = "Required";
                emailError.style.display = "inline";
                return;
            }
            if(password === "") {
                passwordError.innerText = "Required";
                passwordError.style.display = "inline";
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Account created successfully!");
                    emailInput.value = "";
                    passwordInput.value = "";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    if (errorCode === 'auth/email-already-in-use') {
                        emailError.innerText = "Email already exists";
                        emailError.style.display = "inline";
                    } else if (errorCode === 'auth/weak-password') {
                        passwordError.innerText = "Weak password (min 6 chars)";
                        passwordError.style.display = "inline";
                    } else if (errorCode === 'auth/invalid-email') {
                        emailError.innerText = "Invalid email";
                        emailError.style.display = "inline";
                    } else {
                        passwordError.innerText = "Sign Up Failed";
                        passwordError.style.display = "inline";
                    }
                });
        });

        // AUTHENTICATION LOGIN
        document.getElementById("loginBtn").addEventListener("click", () => {
            clearErrors();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if(email === "") {
                emailError.innerText = "Required";
                emailError.style.display = "inline";
                return;
            }
            if(password === "") {
                passwordError.innerText = "Required";
                passwordError.style.display = "inline";
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    emailInput.value = "";
                    passwordInput.value = "";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    if (errorCode === 'auth/wrong-password' || errorCode === 'auth/invalid-credential') {
                        passwordError.innerText = "Incorrect password";
                        passwordError.style.display = "inline";
                    } else if (errorCode === 'auth/user-not-found') {
                        emailError.innerText = "Email not found";
                        emailError.style.display = "inline";
                    } else if (errorCode === 'auth/invalid-email') {
                        emailError.innerText = "Invalid email";
                        emailError.style.display = "inline";
                    } else {
                        passwordError.innerText = "Login failed";
                        passwordError.style.display = "inline";
                    }
                });
        });

        // AUTHENTICATION LOGOUT
        document.getElementById("logoutBtn").addEventListener("click", () => {
            signOut(auth).then(() => {
                clearErrors();
            }).catch((error) => {
                console.error("Logout Error", error);
            });
        });

        // COMMENTS LOADING (REALTIME)
        let unsubscribeComments = null;
        function loadCommentsRealTime() {
            if(unsubscribeComments) unsubscribeComments();

            unsubscribeComments = onSnapshot(commentsCollection, (snapshot) => {
                const box = document.getElementById("comments");
                box.innerHTML = ""; 

                if (snapshot.empty) {
                    box.innerHTML = "<p style='color: #657786;'>No comments yet. Be the first!</p>";
                    return;
                }

                snapshot.forEach((snapshotDoc) => {
                    const data = snapshotDoc.data();
                    const docId = snapshotDoc.id; 
                    const displayEmail = data.email ? data.email : (data.name ? data.name : "Anonymous");
                    const displayComment = data.comment ? data.comment : "";

                    let newComment = document.createElement("div");
                    newComment.className = "comment-box";
                                         
                    let detailsDiv = document.createElement("div");
                    detailsDiv.className = "comment-details";
                    detailsDiv.innerHTML = "<b style='color:#66c0f4;'>" + displayEmail + "</b><br><span style='line-height:1.5;'>" + displayComment + "</span>";
                    newComment.appendChild(detailsDiv);

                    if (currentUser && data.userId && data.userId === currentUser.uid) {
                        let deleteBtn = document.createElement("button");
                        deleteBtn.className = "btn-delete";
                        deleteBtn.innerText = "Delete";
                        deleteBtn.addEventListener("click", async () => {
                            if(confirm("Are you sure you want to delete this comment?")) {
                                try {
                                    await deleteDoc(doc(db, "comments", docId));
                                } catch (err) {
                                    alert("Error deleting comment: " + err.message);
                                }
                            }
                        });
                        newComment.appendChild(deleteBtn);
                    }
                    box.appendChild(newComment);
                });
            }, (error) => {
                console.error("Snapshot error: ", error);
                document.getElementById("comments").innerHTML = "<p style='color: #ef4444;'>Failed to load comments. Verify Firebase rules.</p>";
            });
        }

        // POST COMMENT
        document.getElementById("postBtn").addEventListener("click", async () => {
            if (!currentUser) {
                alert("You must be logged in to post a comment!");
                return;
            }

            let commentField = document.getElementById("comment");
            let comment = commentField.value.trim();

            if(comment === ""){
                alert("Please write a comment first!");
                return;
            }

            let btn = document.getElementById("postBtn");
            btn.innerText = "Posting...";
            btn.disabled = true;

            try {
                await addDoc(commentsCollection, {
                    userId: currentUser.uid,
                    email: currentUser.email,
                    comment: comment
                });
                commentField.value = "";
            } catch (error) {
                console.error("Error adding comment: ", error);
                alert("Failed to post comment. Check your Firebase Database rules!");
            } finally {
                btn.innerText = "Post Comment";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
